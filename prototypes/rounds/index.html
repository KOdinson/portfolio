<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rounds | Concept prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* A night-shift tool: one dark theme by choice, large type, every control within thumb reach at the bottom. */
:root {
  --page: #1B1E22; --bg: #0E1114; --card: #171B20; --line: #2B323A; --ink: #F1F3F5; --ink-2: #A3ADB8;
  --ok: #7BD88F; --issue: #FFB454; --danger: #FF7A70; --act: #8FC1FF;
  --font: "Atkinson Hyperlegible", system-ui, "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 17px/1.4 var(--font); display: grid; place-items: center; padding: 0 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--act); outline-offset: 2px; }
h1, h2, p { margin: 0; }

.stage { display: flex; gap: 56px; align-items: center; }
.aside { max-width: 300px; display: grid; gap: 12px; }
.aside h1 { font-size: 44px; line-height: 1; }
.aside .tape { justify-self: start; background: var(--issue); color: #1B1300; font-weight: 700; font-size: 13px; padding: 4px 9px; }
.aside p { color: var(--ink-2); }
@media (max-width: 860px) { .aside { display: none; } }

.phone { width: min(100vw - 32px, 380px); height: min(100vh - 24px, 740px); background: var(--bg); border-radius: 30px; border: 1px solid var(--line);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
.bar { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.bar .r { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.bar b { font-size: 19px; }
.bar span { color: var(--ink-2); font-size: 15px; }
.prog { display: flex; gap: 4px; }
.prog i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.prog i.ok { background: var(--ok); } .prog i.issue { background: var(--issue); }

.body { padding: 14px 18px; overflow: auto; display: grid; gap: 10px; align-content: start; }
.body h2 { font-size: 26px; line-height: 1.15; text-wrap: balance; }
.hint { color: var(--ink-2); font-size: 15px; }
.cp { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.cp.now { border-color: var(--act); }
.cp .m { font-weight: 700; text-align: center; }
.cp.ok .m { color: var(--ok); } .cp.issue .m { color: var(--issue); }
.cp small { display: block; color: var(--ink-2); font-size: 14px; }
.cp .tm { color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 15px; font-weight: 700; }
.chip[aria-pressed="true"] { border-color: var(--act); box-shadow: inset 0 0 0 1px var(--act); }
.banner { border: 2px solid var(--danger); border-radius: 12px; padding: 14px; display: grid; gap: 6px; }
.banner b { color: var(--danger); font-size: 19px; }
.log { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; white-space: pre-wrap; font-size: 15.5px; user-select: all; }

.foot { padding: 12px 18px 20px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big { border: 0; border-radius: 14px; padding: 18px 10px; font-weight: 700; font-size: 18px; min-height: 62px; }
.big.ok { background: var(--ok); color: #06250E; }
.big.issue { background: var(--issue); color: #2B1900; }
.big.plain { background: var(--card); border: 1.5px solid var(--line); }
.big:disabled { opacity: 0.4; cursor: not-allowed; }
.where { text-align: center; color: var(--ink-2); font-size: 15px; }
.where strong { color: var(--ink); }
</style>
</head>
<body>
<div class="stage">
  <div class="aside">
    <span class="tape">Concept prototype · sample site</span>
    <h1>Rounds</h1>
    <p>A patrol log a guard can keep with one thumb, in the dark, that writes the shift handover for them.</p>
    <p>Try it: clear a few checkpoints, report an issue at one, then finish the round.</p>
  </div>
  <main class="phone" aria-live="polite">
    <div class="bar" id="bar"></div>
    <div class="body" id="body"></div>
    <div class="foot" id="foot"></div>
  </main>
</div>

<script>
const POINTS = [['Lobby doors', 'Both sets locked'], ['Loading dock', 'Roll door down, side door locked'], ['Stairwell B', 'Clear, exit door closes'],
  ['Server room', 'Door locked, no alarm light'], ['Parking level 2', 'Gate down, no one inside'], ['Roof access', 'Hatch locked']];
const TYPES = ['Door unsecured', 'Person on site', 'Hazard', 'Damage', 'Something else'];
let marks = [], screen = 'round', draft = null;
const now = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
const cur = () => marks.length;

function handover() {
  const issues = marks.filter((m) => m.type);
  return `Round finished ${now()}\n${POINTS.length} checkpoints, ${POINTS.length - issues.length} clear, ${issues.length} with an issue.\n` +
    (issues.length ? '\n' + issues.map((m) => `${m.at}  ${POINTS[m.i][0]}: ${m.type}${m.photo ? ' (photo)' : ''}${m.help ? ' · help needed' : ''}`).join('\n')
      : '\nNothing to report.');
}

const VIEWS = {
  round: () => ({
    title: 'Night round', sub: `${cur()} of ${POINTS.length}`,
    body: POINTS.map((p, i) => { const m = marks[i]; const cls = m ? (m.type ? 'issue' : 'ok') : i === cur() ? 'now' : '';
      return `<div class="cp ${cls}"><span class="m">${m ? (m.type ? '!' : '✓') : i + 1}</span><span>${p[0]}<small>${m && m.type ? m.type : p[1]}</small></span><span class="tm">${m ? m.at : ''}</span></div>`; }).join(''),
    foot: cur() < POINTS.length
      ? `<div class="where">You are at <strong>${POINTS[cur()][0]}</strong></div><div class="two"><button type="button" class="big issue" data-go="issue">Issue</button><button type="button" class="big ok" data-go="clear">All clear</button></div>`
      : `<button type="button" class="big ok" data-go="finish">Finish round</button>`
  }),
  issue: () => ({
    title: POINTS[cur()][0], sub: 'Report an issue',
    body: `<h2>What did you find?</h2><div class="chips">${TYPES.map((t) => `<button type="button" class="chip" data-type="${t}" aria-pressed="${draft.type === t}">${t}</button>`).join('')}</div>
      <h2 style="margin-top:8px">Does anyone need help right now?</h2>
      <div class="chips"><button type="button" class="chip" data-help="1" aria-pressed="${draft.help === true}">Yes</button><button type="button" class="chip" data-help="0" aria-pressed="${draft.help === false}">No</button></div>
      ${draft.help ? `<div class="banner"><b>Call now, report after.</b><span>Supervisor: (555) 010-0177. If someone is hurt or in danger, call 911 first.</span></div>` : ''}
      <button type="button" class="chip" data-photo aria-pressed="${draft.photo}">${draft.photo ? 'Photo added' : 'Add a photo'}</button>`,
    foot: `<div class="two"><button type="button" class="big plain" data-go="cancel">Back</button><button type="button" class="big issue" data-go="save" ${draft.type && draft.help !== null ? '' : 'disabled'}>Save issue</button></div>`
  }),
  done: () => ({
    title: 'Handover', sub: 'Written for you',
    body: `<h2>Here is your shift note.</h2><p class="hint">Built from what you tapped. Nothing to type at the end of the night.</p><div class="log">${handover()}</div>`,
    foot: `<button type="button" class="big plain" data-go="restart">Start a new round</button>`
  })
};

function render() {
  const v = VIEWS[screen]();
  document.getElementById('bar').innerHTML = `<div class="r"><b>${v.title}</b><span>${v.sub}</span></div>` +
    `<div class="prog">${POINTS.map((p, i) => `<i class="${marks[i] ? (marks[i].type ? 'issue' : 'ok') : ''}"></i>`).join('')}</div>`;
  document.getElementById('body').innerHTML = v.body;
  document.getElementById('foot').innerHTML = v.foot;
  const here = document.querySelector('.cp.now'); if (here) here.scrollIntoView({ block: 'nearest' });
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.type) draft.type = d.type;
  else if (d.help) draft.help = d.help === '1';
  else if ('photo' in d) draft.photo = !draft.photo;
  else if (d.go === 'clear') marks.push({ i: cur(), at: now() });
  else if (d.go === 'issue') { draft = { type: '', help: null, photo: false }; screen = 'issue'; }
  else if (d.go === 'cancel') screen = 'round';
  else if (d.go === 'save') { marks.push({ i: cur(), at: now(), ...draft }); screen = 'round'; }
  else if (d.go === 'finish') screen = 'done';
  else if (d.go === 'restart') { marks = []; screen = 'round'; }
  render();
});
render();
</script>
</body>
</html>
