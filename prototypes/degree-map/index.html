<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Degree Map | Concept prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* A student planning tool: one light theme by choice. The finish date is the headline; everything else explains it. */
:root {
  --bg: #F4F6F5; --card: #FFFFFF; --ink: #17211E; --ink-2: #55635E; --line: #D5DCD9;
  --done: #0F6B5C; --now: #9A6200; --left: #55635E; --act: #0F6B5C; --act-soft: #E0F0EC; --warn-soft: #FFF1D6; --tape: #F2C230;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --font: "Source Sans 3", system-ui, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--font); }
:focus-visible { outline: 3px solid var(--act); outline-offset: 2px; }
h1, h2, p { margin: 0; }
.wrap { max-width: 1080px; margin-inline: auto; padding: 20px 20px 40px; display: grid; gap: 18px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
.head b { font: 700 20px var(--display); }
.tape { background: var(--tape); font-size: 12.5px; font-weight: 600; padding: 3px 8px; }
.head span.who { color: var(--ink-2); margin-left: auto; }

.hero { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: grid; gap: 12px; }
.hero h1 { font: 700 clamp(26px, 4vw, 40px)/1.08 var(--display); text-wrap: balance; }
.hero h1 em { font-style: normal; color: var(--act); }
.hero p { color: var(--ink-2); max-width: 70ch; }
.bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); }
.bar i { display: block; } .bar .d { background: var(--done); } .bar .n { background: repeating-linear-gradient(-45deg, var(--now) 0 6px, #C08A2B 6px 12px); } .bar .p { background: var(--act-soft); border-left: 2px solid var(--card); outline: 2px solid var(--done); outline-offset: -2px; }
.key { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14.5px; color: var(--ink-2); }
.key b { color: var(--ink); }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 800px) { .cols { grid-template-columns: minmax(0, 1fr); } .head span.who { margin-left: 0; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 10px; }
.card h2 { font: 700 20px var(--display); }
.sub { color: var(--ink-2); font-size: 14.5px; }
.pick { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 12px; align-items: start; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; }
.pick:has(input:checked) { border-color: var(--act); background: var(--act-soft); }
.pick input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--act); }
.pick small, .locked small { grid-column: 2 / -1; color: var(--ink-2); font-size: 14px; }
.pick .cr, .locked .cr { color: var(--ink-2); font-size: 14px; white-space: nowrap; }
.locked { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 12px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 12px; color: var(--ink-2); }
.locked b { color: var(--ink); }
.locked small { background: var(--warn-soft); color: var(--ink); padding: 4px 8px; border-radius: 6px; justify-self: start; }
.sum { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; }
.sum b { font-size: 17px; }
.warn { background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; font-size: 14.5px; }

.grp { font-weight: 700; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); margin-top: 6px; }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 15px; }
.row .st { font-weight: 600; font-size: 14px; white-space: nowrap; }
.st.done { color: var(--done); } .st.now { color: var(--now); } .st.left { color: var(--left); } .st.plan { color: var(--act); }
.row .code { font-weight: 600; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><b>Degree Map</b><span class="tape">Concept prototype · invented program</span><span class="who">A.A.S. sample program · 60 credits · now: Fall 2026</span></div>

  <div class="hero" aria-live="polite">
    <h1 id="finish"></h1>
    <p id="reason"></p>
    <div class="bar" id="bar" role="img"></div>
    <div class="key" id="key"></div>
  </div>

  <div class="cols">
    <div class="card">
      <h2>Plan Spring 2027</h2>
      <p class="sub">Tick what you intend to take. The finish date above updates as you choose.</p>
      <div id="picks" style="display: grid; gap: 8px;"></div>
      <div class="sum" id="sum"></div>
    </div>
    <div class="card">
      <h2>Every requirement</h2>
      <p class="sub">The same 20 courses your advisor sees, in plain status words.</p>
      <div id="all"></div>
    </div>
  </div>
</div>

<script>
// An invented 60-credit program. Course codes are made up for this prototype.
const C = [
  ['ENG 101', 'Composition I', 'General education', 'done'], ['MAT 110', 'College Algebra', 'General education', 'done'],
  ['COM 105', 'Public Speaking', 'General education', 'done'], ['SOC 101', 'Introduction to Sociology', 'General education', 'done'],
  ['ENG 201', 'Technical Writing', 'General education', 'left', ['ENG 101'], 'FS'], ['MAT 150', 'Statistics', 'General education', 'left', [], 'FS'],
  ['CIT 100', 'Computer Fundamentals', 'Core', 'done'], ['CIT 120', 'Operating Systems', 'Core', 'done'],
  ['NET 120', 'Networking I', 'Core', 'done'], ['NET 220', 'Networking II', 'Core', 'left', ['NET 120'], 'FS'],
  ['PRG 130', 'Scripting', 'Core', 'done'], ['DBS 140', 'Databases', 'Core', 'done'],
  ['SEC 110', 'Security Fundamentals', 'Program', 'done'], ['SEC 210', 'Network Defense', 'Program', 'done'],
  ['SEC 220', 'Risk Management', 'Program', 'done'], ['SEC 225', 'Ethical Hacking', 'Program', 'now'],
  ['SEC 230', 'Security Operations', 'Program', 'now'], ['SEC 235', 'Cloud Security', 'Program', 'now'],
  ['SEC 250', 'Digital Forensics', 'Program', 'left', ['SEC 210'], 'F'], ['SEC 240', 'Capstone Project', 'Program', 'left', ['SEC 230'], 'S']
].map(([code, title, group, status, pre = [], terms = '']) => ({ code, title, group, status, pre, terms }));
const by = (code) => C.find((c) => c.code === code);
const left = C.filter((c) => c.status === 'left');
const picked = new Set(['NET 220', 'SEC 240']);
const $ = (id) => document.getElementById(id);

function lockReason(c) {
  if (!c.terms.includes('S')) return 'Runs only in fall. The next chance is Fall 2027.';
  return '';
}
function note(c) {
  const pending = c.pre.filter((p) => by(p).status === 'now');
  if (pending.length) return 'Open to you if you pass ' + pending.join(' and ') + ' this term.';
  return c.terms === 'S' ? 'Runs only in spring.' : 'Runs every term.';
}

// Walk forward term by term: spring takes what was ticked, later terms take everything offered.
function finish() {
  let remaining = left.filter((c) => !picked.has(c.code)), year = 2027, term = 'S';
  while (remaining.length && year < 2032) {
    term = term === 'S' ? 'F' : 'S'; if (term === 'S') year++;
    remaining = remaining.filter((c) => !c.terms.includes(term));
  }
  return { label: (term === 'F' ? 'Fall ' : 'Spring ') + year };
}
function render() {
  const f = finish(), credits = picked.size * 3, done = C.filter((c) => c.status === 'done').length * 3, now = C.filter((c) => c.status === 'now').length * 3;
  const skippedSpringOnly = left.find((c) => c.terms === 'S' && !picked.has(c.code)), fallOnly = left.find((c) => c.terms === 'F');
  $('finish').innerHTML = `You can finish in <em>${f.label}</em>.`;
  $('reason').textContent = skippedSpringOnly
    ? `${skippedSpringOnly.code} ${skippedSpringOnly.title} runs only in spring. Leaving it out of this plan moves your finish from Fall 2027 to Spring 2028.`
    : `One course sets that date: ${fallOnly.code} ${fallOnly.title} runs only in fall, so Fall 2027 is the earliest you can take it. Everything else fits before then.`;
  $('bar').innerHTML = `<i class="d" style="width:${done / 60 * 100}%"></i><i class="n" style="width:${now / 60 * 100}%"></i><i class="p" style="width:${credits / 60 * 100}%"></i>`;
  $('bar').setAttribute('aria-label', `${done} credits done, ${now} in progress, ${credits} planned, of 60`);
  $('key').innerHTML = `<span><b>${done}</b> credits done</span><span><b>${now}</b> in progress this term</span><span><b>${credits}</b> planned for spring</span><span><b>${60 - done - now - credits}</b> still to place</span>`;

  $('picks').innerHTML = left.map((c) => { const why = lockReason(c), id = 'p-' + c.code.replace(' ', '');
    return why ? `<div class="locked"><span aria-hidden="true">—</span><span><b>${c.code}</b> ${c.title}</span><span class="cr">3 cr</span><small>${why}</small></div>`
      : `<label class="pick" for="${id}"><input type="checkbox" id="${id}" value="${c.code}" ${picked.has(c.code) ? 'checked' : ''}><span><b>${c.code}</b> ${c.title}</span><span class="cr">3 cr</span><small>${note(c)}</small></label>`; }).join('');
  $('sum').innerHTML = `<b>${credits} credits in Spring 2027</b><span class="sub">${credits >= 12 ? 'Full-time load.' : credits >= 6 ? 'Part-time load. Check what your financial aid requires.' : 'Under half-time. Check what your financial aid requires.'}</span>`
    + (skippedSpringOnly ? `<span class="warn">Add ${skippedSpringOnly.code} to keep a Fall 2027 finish.</span>` : '');

  let h = '', g = '';
  for (const c of C) {
    if (c.group !== g) { g = c.group; h += `<div class="grp">${g}</div>`; }
    const planned = picked.has(c.code), st = planned ? ['plan', 'Planned, spring'] : c.status === 'done' ? ['done', '✓ Done'] : c.status === 'now' ? ['now', 'Taking now'] : ['left', 'Still to take'];
    h += `<div class="row"><span class="code">${c.code}</span><span>${c.title}</span><span class="st ${st[0]}">${st[1]}</span></div>`;
  }
  $('all').innerHTML = h;
}
$('picks').addEventListener('change', (e) => { if (e.target.checked) picked.add(e.target.value); else picked.delete(e.target.value); const id = e.target.id; render(); $(id).focus(); });
render();
</script>
</body>
</html>
